name: Build Life Notice AI v1.2 APK

on:
  push:
    branches: [ai-v12-build]
    paths:
      - 'staging/ai-v12-ready.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ai-v12:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: ai-v12-build

      - name: Restore verified v1.2 source
        shell: bash
        run: |
          set -euo pipefail
          cat staging/ai-v12-part-* | base64 -d > /tmp/life-notice-ai-v12.tar.gz
          echo "b1542dec27c0d5e3be3ef46e225f514a9b011e7207961194422d7f7135a65df2  /tmp/life-notice-ai-v12.tar.gz" | sha256sum -c -
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          tar -xzf /tmp/life-notice-ai-v12.tar.gz -C .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies and verify
        run: |
          npm install --no-audit --no-fund
          npm run verify

      - name: Generate Android native project
        env:
          CI: 1
          NODE_ENV: production
        run: npm run prebuild:android

      - name: Build installable APK
        env:
          NODE_ENV: production
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleRelease --no-daemon

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/release/app-release.apk life-notice-ai-v12.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: life-notice-ai-v12
          path: life-notice-ai-v12.apk
          if-no-files-found: error

      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="ai-preview-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" life-notice-ai-v12.apk \
            --target "$GITHUB_SHA" \
            --title "生活通知管家 AI 測試版 v1.2 #${GITHUB_RUN_NUMBER}" \
            --notes "Android v1.2 AI 測試版。AI 預設關閉；請在 App 設定中使用你自己新建立的 OpenAI API key。不要使用已公開或已撤銷的 key。"

      - name: Commit clean verified source to main
        shell: bash
        run: |
          set -euo pipefail
          rm -f life-notice-ai-v12.apk
          rm -rf android ios dist staging
          printf '\n# Generated build outputs\nandroid/\nios/\ndist/\n**/build/\n*.apk\n*.aab\n' >> .gitignore
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release Life Notice v1.2 AI notification assistant"
          git push --force origin HEAD:main
