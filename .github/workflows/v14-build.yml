name: Build Life Notice Android preview

on:
  workflow_dispatch:
  push:
    branches: [v14-build, codex/listener-settings]

permissions:
  contents: write

jobs:
  build-v15:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      APP_IDENTIFIER: com.bryan931218.lifenotice
    steps:
      - name: Checkout current source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          npm ci --ignore-scripts --no-audit --no-fund || {
            npm cache clean --force
            npm ci --ignore-scripts --no-audit --no-fund
          }

      - name: Ensure generated assets
        shell: bash
        run: |
          set -euo pipefail
          test -f assets/icon.png
          test -f assets/notification-icon.png
          if [ ! -f assets/adaptive-icon.png ]; then cp assets/icon.png assets/adaptive-icon.png; fi

      - name: Verify TypeScript and tests
        run: npm run verify

      - name: Generate Android native project
        env:
          CI: 1
          NODE_ENV: production
        run: npm run prebuild:android

      - name: Build APK and AAB
        env:
          NODE_ENV: production
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          cd android
          ./gradlew :notice-listener:testDebugUnitTest :app:assembleRelease :app:bundleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Prepare packages
        shell: bash
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk life-notice-v1.5.6.apk
          cp android/app/build/outputs/bundle/release/app-release.aab life-notice-v1.5.6.aab
          sha256sum life-notice-v1.5.6.apk life-notice-v1.5.6.aab > SHA256SUMS.txt

      - name: Upload Android packages
        uses: actions/upload-artifact@v4
        with:
          name: life-notice-v1.5.6-android
          path: |
            life-notice-v1.5.6.apk
            life-notice-v1.5.6.aab
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish test release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v156-preview-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" life-notice-v1.5.6.apk SHA256SUMS.txt \
            --target "$GITHUB_SHA" --prerelease \
            --title "生活通知管家 v1.5.6 Android 測試版 #${GITHUB_RUN_NUMBER}" \
            --notes "v1.5.6 測試版：修正既有通知未補掃、儲存監聽 App 後未重新掃描、點號時間與分段訊息時段未辨識，以及背景自動加入行事曆設定未同步。測試簽章，非商店正式版。"
