name: Bootstrap Life Notice and Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-life-notice
  cancel-in-progress: false

jobs:
  bootstrap-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout bootstrap repository
        uses: actions/checkout@v4

      - name: Verify and restore uploaded project
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/source-00 bootstrap/source-01 bootstrap/source-02 bootstrap/source-03 | base64 -d > /tmp/life-notice-source.tar.gz
          echo "5ca3971dd2bd1f9ccf6252e2d71dc1b71aceaa17d218aa38a9baf129225b59a8  /tmp/life-notice-source.tar.gz" | sha256sum -c -
          mkdir -p /tmp/life-notice-source
          tar -xzf /tmp/life-notice-source.tar.gz -C /tmp/life-notice-source
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/life-notice-source/. .

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies and verify app
        run: |
          npm install
          npm run verify

      - name: Commit clean project to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Life Notice app and release pipeline"
          REMOTE="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          git push --force-with-lease=refs/heads/main:"$REMOTE" origin HEAD:main

      - name: Generate Android native project
        env:
          CI: 1
        run: npm run prebuild:android

      - name: Build installable release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleRelease --no-daemon

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/release/app-release.apk life-notice-preview.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: life-notice-preview
          path: life-notice-preview.apk
          if-no-files-found: error

      - name: Publish direct-download preview release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$(git rev-parse HEAD)"
          TAG="preview-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" life-notice-preview.apk \
            --target "$TARGET" \
            --title "生活通知管家 Android 測試版 #${GITHUB_RUN_NUMBER}" \
            --notes "可直接安裝於 Android 手機的內部測試版。此 APK 使用測試簽章，不是 Google Play 正式上架包。" \
            --latest
